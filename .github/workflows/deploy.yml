name: Build & Deploy Veloce Hub

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-test:
    name: Test & Build Production Bundle
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Type Checking
        run: npm run lint

      - name: Build Frontend & Server Bundle
        run: npm run build

      - name: Verify Build Output
        run: |
          ls -la dist/
          test -f dist/index.html && echo "Frontend index.html generated successfully."
          test -f dist/server.cjs && echo "Backend server.cjs bundle generated successfully."

      - name: Archive Production Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: veloce-production-dist
          path: dist/
          retention-days: 7
