version: '3.8'

services:
  # --------------------------------------------------------------------------
  # Primary Relational Database (PostgreSQL 16)
  # --------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: veloce_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-veloce_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_secure_pass_2026}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-veloce_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # --------------------------------------------------------------------------
  # High-Performance In-Memory Store & Task Broker (Redis 7)
  # --------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: veloce_redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass "${REDIS_PASSWORD:-redis_secure_pass_2026}"
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redis_secure_pass_2026}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # --------------------------------------------------------------------------
  # Fast Faceted Typo-Tolerant Search Engine (Meilisearch v1.12)
  # --------------------------------------------------------------------------
  meilisearch:
    image: getmeili/meilisearch:v1.12
    container_name: veloce_meilisearch
    restart: unless-stopped
    environment:
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:-meili_master_key_veloce_2026_secure}
      MEILI_ENV: ${MEILI_ENV:-development}
      MEILI_NO_ANALYTICS: "true"
      MEILI_MAX_INDEXING_MEMORY: 500MB
    volumes:
      - meili_data:/meili_data
    ports:
      - "7700:7700"

  # --------------------------------------------------------------------------
  # Django REST Framework Backend API
  # --------------------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: veloce_backend
    restart: unless-stopped
    command: gunicorn core.wsgi:application --bind 0.0.0.0:8000 --workers 4 --threads 2 --timeout 60
    volumes:
      - ./backend:/app
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    environment:
      DJANGO_DEBUG: "False"
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-s79zq2mp8vw5xk1y3jb6cd4ef0ghrtuazxcvbnmk}
      ALLOWED_HOSTS: "localhost,127.0.0.1,backend,ropenix.co.ke,www.ropenix.co.ke,veloce.co.ke"
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres_secure_pass_2026}@postgres:5432/${POSTGRES_DB:-veloce_db}
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD:-redis_secure_pass_2026}@redis:6379/0
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD:-redis_secure_pass_2026}@redis:6379/1
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis_secure_pass_2026}@redis:6379/2
      MEILISEARCH_URL: http://meilisearch:7700
      MEILISEARCH_MASTER_KEY: ${MEILI_MASTER_KEY:-meili_master_key_veloce_2026_secure}
      CORS_ALLOWED_ORIGINS: "http://localhost:3000,http://127.0.0.1:3000,https://ropenix.co.ke,https://www.ropenix.co.ke,https://veloce.co.ke"
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      meilisearch:
        condition: service_started

  # --------------------------------------------------------------------------
  # Asynchronous Background Task Worker (Celery)
  # --------------------------------------------------------------------------
  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: veloce_celery_worker
    restart: unless-stopped
    command: celery -A core worker -l info --concurrency=4 -Q default,indexing,emails,orders
    volumes:
      - ./backend:/app
      - media_volume:/app/media
    environment:
      DJANGO_DEBUG: "False"
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-s79zq2mp8vw5xk1y3jb6cd4ef0ghrtuazxcvbnmk}
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres_secure_pass_2026}@postgres:5432/${POSTGRES_DB:-veloce_db}
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD:-redis_secure_pass_2026}@redis:6379/0
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD:-redis_secure_pass_2026}@redis:6379/1
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis_secure_pass_2026}@redis:6379/2
      MEILISEARCH_URL: http://meilisearch:7700
      MEILISEARCH_MASTER_KEY: ${MEILI_MASTER_KEY:-meili_master_key_veloce_2026_secure}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # --------------------------------------------------------------------------
  # Periodic Task Scheduler (Celery Beat)
  # --------------------------------------------------------------------------
  celery_beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: veloce_celery_beat
    restart: unless-stopped
    command: celery -A core beat -l info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    volumes:
      - ./backend:/app
    environment:
      DJANGO_DEBUG: "False"
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-s79zq2mp8vw5xk1y3jb6cd4ef0ghrtuazxcvbnmk}
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres_secure_pass_2026}@postgres:5432/${POSTGRES_DB:-veloce_db}
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD:-redis_secure_pass_2026}@redis:6379/0
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD:-redis_secure_pass_2026}@redis:6379/1
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  meili_data:
    driver: local
  static_volume:
  media_volume:
