  <!-- Base Structured Data (JSON-LD) for Search Engines -->
  <script type="application/ld+json" id="structured-data-organization">

    "@context": "https://schema.org",
    "@type": "Organization",
    "name": "Veloce",
    "legalName": "Ropenix Investments Limited",

  <script type="application/ld+json" id="structured-data-website">

    "name": "Veloce Marketplace",
    "url": "https://veloce.co.ke",
    "potentialAction": {
      "@type": "SearchAction",
      "target": {
        "@type": "EntryPoint",
        "urlTemplate": "https://veloce.co.ke/?tab=store&search={search_term_string}"
      },
      "query-input": "required name=search_term_string"
    }
  }
  </script>
