    (function() {
      try {
        var raw = localStorage.getItem('ropenix_site_settings_cache') || localStorage.getItem('veloce_site_settings_cache');
        if (raw) {
          var data = JSON.parse(raw);
          if (data && data.appearance) {
            var app = data.appearance;
            var root = document.documentElement;
            if (app.primary_color) {
              root.style.setProperty('--color-primary', app.primary_color);
              root.style.setProperty('--color-indigo-600', app.primary_color);
              root.style.setProperty('--color-brand-primary', app.primary_color);
              root.style.setProperty('--primary', app.primary_color);
            }
            if (app.accent_color) {
              root.style.setProperty('--color-accent', app.accent_color);
              root.style.setProperty('--color-amber-500', app.accent_color);
              root.style.setProperty('--color-brand-accent', app.accent_color);
              root.style.setProperty('--accent', app.accent_color);
            }
            if (app.secondary_color) {
              root.style.setProperty('--color-secondary', app.secondary_color);
              root.style.setProperty('--color-cyan-500', app.secondary_color);
            }
            if (app.font_scale) {
              var scaleMap = { '87%': '0.875', '100%': '1', '116%': '1.16', '130%': '1.3' };
              var scale = scaleMap[app.font_scale] || '1';
              root.style.setProperty('--font-scale', scale);
              root.style.setProperty('--app-font-scale', scale);
              root.style.fontSize = (Number(scale) * 100) + '%';
            }
          }
        }
      } catch (e) {}
    })();
  </script>

  <script type="text/javascript">
    function purgeGoogleTranslateCookies() {
      try {
        var host = window.location.hostname;
        var parts = host ? host.split('.') : [];
        var domains = ['', host, '.' + host];
        for (var i = 1; i < parts.length; i++) {
          var parent = parts.slice(i).join('.');
          if (parent) {
            domains.push(parent);
            domains.push('.' + parent);
          }
        }
        var paths = ['/', '', window.location.pathname];
        domains.forEach(function(dom) {
          paths.forEach(function(pth) {
            var base = 'googtrans=; expires=Thu, 01 Jan 1970 00:00:00 UTC; Max-Age=0; path=' + pth;
            if (dom) {
              document.cookie = base + '; domain=' + dom + ';';
            } else {
              document.cookie = base + ';';
            }
          });
        });
      } catch (e) {}
    }

    (function() {
      // Sync initial saved language with Google Translate cookie BEFORE element.js loads
      try {
        var savedLang = localStorage.getItem('veloce_language');
        if (!savedLang || savedLang === 'en') {
          // If preference is English or unset, guarantee googtrans is completely purged before Google Translate loads
          purgeGoogleTranslateCookies();
        } else {
          var gtLang = savedLang === 'zh' ? 'zh-CN' : savedLang;
          document.cookie = "googtrans=/en/" + gtLang + "; path=/;";
          if (window.location.hostname && window.location.hostname !== 'localhost') {
            document.cookie = "googtrans=/en/" + gtLang + "; domain=." + window.location.hostname + "; path=/;";
          }
        }
      } catch (e) {}
    })();

    function googleTranslateElementInit() {
      try {
        if (window.google && window.google.translate) {
          new window.google.translate.TranslateElement({
            pageLanguage: 'en',
            includedLanguages: 'en,sw,fr,ko,zh-CN,de',
            autoDisplay: false
          }, 'google_translate_element');
        }
      } catch (e) {
        // Safe fallback if client extensions or adblockers block background telemetry
      }
    }
  </script>
