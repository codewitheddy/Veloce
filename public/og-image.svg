<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <!-- Accent Gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>

    <!-- Gold Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>

    <!-- Glass card stroke -->
    <linearGradient id="strokeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.05"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="60" result="blur"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>

  <!-- Ambient Glow Orbs -->
  <circle cx="200" cy="150" r="220" fill="#4f46e5" opacity="0.22" filter="url(#glow)"/>
  <circle cx="1050" cy="480" r="260" fill="#0284c7" opacity="0.18" filter="url(#glow)"/>
  <circle cx="900" cy="180" r="180" fill="#fbbf24" opacity="0.12" filter="url(#glow)"/>

  <!-- Subtle Tech Grid Lines -->
  <g opacity="0.04" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="105" x2="1200" y2="105"/>
    <line x1="0" y1="210" x2="1200" y2="210"/>
    <line x1="0" y1="315" x2="1200" y2="315"/>
    <line x1="0" y1="420" x2="1200" y2="420"/>
    <line x1="0" y1="525" x2="1200" y2="525"/>
    <line x1="200" y1="0" x2="200" y2="630"/>
    <line x1="400" y1="0" x2="400" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="800" y1="0" x2="800" y2="630"/>
    <line x1="1000" y1="0" x2="1000" y2="630"/>
  </g>

  <!-- Left Main Content Block -->
  <g transform="translate(100, 90)">
    <!-- Brand Badge & Logo -->
    <g>
      <rect width="56" height="56" rx="14" fill="#4f46e5"/>
      <path d="M12.25 15.75L28 40.25L43.75 15.75H34.125L28 27.125L21.875 15.75H12.25Z" fill="white"/>
      <text x="74" y="38" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="900" fill="#ffffff" letter-spacing="1">VELOCE</text>
    </g>

    <!-- Verified Badge -->
    <g transform="translate(420, 14)">
      <rect width="185" height="32" rx="16" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <circle cx="16" cy="16" r="5" fill="#10b981"/>
      <text x="30" y="21" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#94a3b8" letter-spacing="1.5">OFFICIAL PLATFORM</text>
    </g>

    <!-- Catchy Headline -->
    <text x="0" y="140" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="52" font-weight="800" fill="#ffffff" letter-spacing="-1">
      Premium eCommerce &amp;
    </text>
    <text x="0" y="200" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="52" font-weight="800" fill="url(#accentGrad)" letter-spacing="-1">
      Affiliate Marketplace
    </text>

    <!-- Description -->
    <text x="0" y="260" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="400" fill="#94a3b8" width="600">
      Bespoke Tailoring • Physical Hardware • Digital Assets • Verified Commissions
    </text>

    <!-- Feature Pills -->
    <g transform="translate(0, 310)">
      <!-- Pill 1 -->
      <g>
        <rect width="175" height="42" rx="21" fill="#1e293b" stroke="url(#strokeGrad)" stroke-width="1"/>
        <text x="22" y="26" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#e2e8f0">🛍️ Curated Store</text>
      </g>
      <!-- Pill 2 -->
      <g transform="translate(190, 0)">
        <rect width="190" height="42" rx="21" fill="#1e293b" stroke="url(#strokeGrad)" stroke-width="1"/>
        <text x="22" y="26" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#e2e8f0">✂️ Bespoke Fitting</text>
      </g>
      <!-- Pill 3 -->
      <g transform="translate(395, 0)">
        <rect width="190" height="42" rx="21" fill="#1e293b" stroke="url(#strokeGrad)" stroke-width="1"/>
        <text x="22" y="26" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#e2e8f0">⚡ Instant Delivery</text>
      </g>
    </g>

    <!-- Domain Footer -->
    <g transform="translate(0, 410)">
      <text x="0" y="24" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="700" fill="#64748b" letter-spacing="1.5">
        HTTPS://VELOCE.CO.KE
      </text>
    </g>
  </g>

  <!-- Right Decorative Feature Card -->
  <g transform="translate(770, 90)">
    <!-- Glassmorphic Card Container -->
    <rect width="330" height="450" rx="28" fill="#0f172a" fill-opacity="0.7" stroke="url(#strokeGrad)" stroke-width="1.5"/>
    
    <!-- Top Card Header -->
    <g transform="translate(25, 30)">
      <rect width="40" height="40" rx="10" fill="#1e293b"/>
      <path d="M15 20L19 24L27 16" stroke="#10b981" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="52" y="18" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#ffffff">Marketplace Engine</text>
      <text x="52" y="34" font-family="system-ui, sans-serif" font-size="11" font-weight="400" fill="#64748b">Unified Commerce Node</text>
    </g>

    <!-- Card Metric 1 -->
    <g transform="translate(25, 100)">
      <rect width="280" height="75" rx="16" fill="#1e293b" fill-opacity="0.6"/>
      <text x="18" y="30" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#94a3b8">Active Products Catalog</text>
      <text x="18" y="58" font-family="system-ui, sans-serif" font-size="24" font-weight="800" fill="#ffffff">1,000+ Items</text>
      <circle cx="250" cy="38" r="14" fill="#312e81"/>
      <path d="M246 38L254 38M250 34L254 38L250 42" stroke="#818cf8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- Card Metric 2 -->
    <g transform="translate(25, 190)">
      <rect width="280" height="75" rx="16" fill="#1e293b" fill-opacity="0.6"/>
      <text x="18" y="30" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#94a3b8">Customer Satisfaction</text>
      <text x="18" y="58" font-family="system-ui, sans-serif" font-size="24" font-weight="800" fill="url(#goldGrad)">4.9 / 5.0 ★</text>
    </g>

    <!-- Card Metric 3 -->
    <g transform="translate(25, 280)">
      <rect width="280" height="75" rx="16" fill="#1e293b" fill-opacity="0.6"/>
      <text x="18" y="30" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#94a3b8">Secure Payment Rail</text>
      <text x="18" y="58" font-family="system-ui, sans-serif" font-size="18" font-weight="700" fill="#10b981">M-Pesa &amp; Card TLS</text>
    </g>

    <!-- Card CTA Badge -->
    <g transform="translate(25, 375)">
      <rect width="280" height="45" rx="12" fill="url(#accentGrad)"/>
      <text x="75" y="28" font-family="system-ui, sans-serif" font-size="14" font-weight="800" fill="#ffffff">SHOP VELOCE ➔</text>
    </g>
  </g>
</svg>
